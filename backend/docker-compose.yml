name: ecobite

services:
  postgres:
    image: postgres:17
    container_name: ecobite-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ecobite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecobite_db


    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ecobite_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecobite -d ecobite_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecobite_postgres_data:
